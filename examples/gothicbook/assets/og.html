<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gothicbook social card source</title>
<style>
	html,
	body {
		width: 100%;
		height: 100%;
		margin: 0;
	}

	body {
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 44px;
		background: #f7f7f5;
		color: #1f2933;
		font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	}

	.brand {
		display: flex;
		align-items: baseline;
		gap: 4px;
		color: #956cf4;
	}

	.brand img {
		display: block;
		width: 520px;
		height: auto;
	}

	.brand span {
		font-size: 132px;
		font-weight: 700;
		letter-spacing: -0.045em;
		line-height: 1;
	}

	p {
		margin: 0;
		max-width: 900px;
		color: #5b6670;
		font-size: 28px;
		text-align: center;
	}
</style>
</head>
<body>
	<div class="brand">
		<img src="gothic-wordmark.svg" alt="Gothic">
		<span>book</span>
	</div>
	<p>A tiny design system demo for the installable gothic UI kit.</p>
</body>
</html>
